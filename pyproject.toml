[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basic-fns-mcp"
version = "0.1.0"
description = "A streamable-HTTP MCP server exposing basic filesystem, shell, and search tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
basic-fns-mcp = "basic_fns_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_fns_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
